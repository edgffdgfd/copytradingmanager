<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copy Trading</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#16324F"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#F3F5F4;--ink:#12201F;--mu:#5F6F6D;--ln:#DCE4E2;--br:#16324F;--pos:#0E7A52;--neg:#C0392B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{background:var(--br);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}header b{font-size:17px;font-weight:600}
nav{background:#fff;border-bottom:1px solid var(--ln);display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav button{padding:12px 14px;color:var(--mu);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}nav button.on{color:var(--br);border-color:var(--br)}
main{max-width:1040px;margin:0 auto;padding:20px 14px 60px}
button{font:inherit;background:none;border:0;cursor:pointer;color:inherit}
.btn{background:var(--br);color:#fff;padding:10px 18px;border-radius:6px;font-weight:500;margin:4px 6px 0 0}.btn.o{background:#fff;color:var(--br);border:1px solid var(--ln)}
.card{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:16px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0 20px}
.kp div{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:14px}.kp small{display:block;color:var(--mu);font-size:13px}.kp b{font-size:22px;font-weight:600}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mu);font-size:13px}td,th{padding:10px 8px;border-top:1px solid var(--ln)}th{border-top:0}.n{text-align:right}
tr.go{cursor:pointer}tr.go:hover{background:var(--bg)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mu{color:var(--mu)}
.bar{height:6px;background:var(--ln);border-radius:3px;min-width:70px}.bar i{display:block;height:100%;background:var(--br);border-radius:3px}
input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:6px;background:#fff;margin:4px 0 10px}input[type=checkbox]{width:auto;margin:0 10px 0 0}
label{font-size:13px;color:var(--mu);display:block}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
h1{font-size:24px;margin:0 0 4px;font-weight:600}h2{font-size:18px;margin:24px 0 10px;font-weight:600}
.ch{width:100%;height:110px}.ov{overflow-x:auto}
@media print{header,nav,.np{display:none}}
</style></head>
<body><div id="app"></div>
<script>
const sb=supabase.createClient('https://clxkaxvpqndzmzkhgabt.supabase.co','sb_publishable_5N8TARUQX88KmWsACvfhvg_5gARI8gx');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10);
const sg=n=>`<b class="${n<0?'neg':'pos'}">${n>0?'+':''}${fmt(n)}</b>`,sum=(a,f)=>a.reduce((s,r)=>s+Number(f(r)||0),0);
let me,D={},RP=[];const pages={};
async function q(t,sel='*',f=x=>x){const{data,error}=await f(sb.from(t).select(sel));if(error)alert(error.message);return data||[]}
async function load(){const[i,a,t,p]=await Promise.all([q('investors','id,name,code'),q('accounts'),q('transactions','*',x=>x.order('tx_date',{ascending:false})),q('daily_profit','*',x=>x.order('pdate',{ascending:false}))]);
 const accU=[...new Map(a.map(r=>[r.id,r])).values()];
 D={inv:i,nm:Object.fromEntries(i.map(r=>[r.id,r.name])),acc:accU,tx:t,pl:p}}
function st(a){const t=D.tx.filter(x=>x.account_id===a.id),p=D.pl.filter(x=>x.account_id===a.id),f=k=>sum(t.filter(x=>x.type===k),x=>x.amount),inv=f('deposit'),wd=f('withdrawal'),po=f('profit_payout'),paidOut=wd+po;
 return{t,p,inv,wd,po,paidOut,pr:sum(p,x=>x.amount),bal:Number(a.current_balance||0),left:inv-paidOut,ret:inv>0?paidOut/inv*100:0}}
const agg=l=>{const s=l.map(st);return{inv:sum(s,x=>x.inv),wd:sum(s,x=>x.paidOut),pr:sum(s,x=>x.pr),bal:sum(s,x=>x.bal),left:sum(s,x=>x.left)}};
const kp=s=>`<div class="kp"><div><small>Invested</small><b>${fmt(s.inv)}</b></div><div><small>Paid out</small><b class="pos">${fmt(s.paidOut??s.wd)}</b></div><div><small>Still to recover</small><b>${fmt(Math.max(s.left,0))}</b></div><div><small>Profit / loss</small>${sg(s.pr)}</div><div><small>Account balance</small><b>${fmt(s.bal)}</b></div></div>`;
function bars(p){const d=p.slice(0,30).reverse();if(!d.length)return'<p class="mu">No daily profit or loss recorded yet.</p>';const mx=Math.max(...d.map(r=>Math.abs(r.amount)),1),w=300/d.length;
 return`<svg viewBox="0 0 300 100" preserveAspectRatio="none" class="ch">${d.map((r,i)=>{const h=Math.abs(r.amount)/mx*46;return`<rect x="${i*w+1}" y="${r.amount>=0?50-h:50}" width="${w-2}" height="${Math.max(h,1)}" fill="${r.amount>=0?'#0E7A52':'#C0392B'}"><title>${r.pdate}: ${fmt(r.amount)}</title></rect>`}).join('')}<line x1="0" x2="300" y1="50" y2="50" stroke="#C9D3D1" vector-effect="non-scaling-stroke"/></svg><p class="mu" style="margin:6px 0 0">Last ${d.length} days</p>`}

function loginView(){$('#app').innerHTML=`<div style="max-width:360px;margin:12vh auto;padding:0 16px"><h1>Copy Trading</h1><p class="mu">Sign in to view your investments.</p><div class="card"><label>Email<input id="em" type="email"></label><label>Password<input id="pw" type="password"></label><button class="btn" style="width:100%" onclick="login()">Sign in</button><p id="msg" class="neg"></p></div></div>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?$('#msg').textContent=error.message:start()}
async function start(){const{data:{session}}=await sb.auth.getSession();if(!session)return loginView();
 const{data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).single();me={id:session.user.id,admin:p?.role==='admin'};
 const T=me.admin?[['dash','Overview'],['mg','Manage'],['acx','Access'],['rep','Statement']]:[['dash','Overview'],['rep','Statement']];
 $('#app').innerHTML=`<header><b>Copy Trading</b><span style="display:flex;align-items:center;gap:12px"><span style="color:#C9D3D1;font-size:13px">${me.admin?"Admin":"Investor"} · ${esc(session.user.email)}</span><button onclick="sb.auth.signOut().then(start)">Sign out</button></span></header><nav>${T.map(([k,l])=>`<button data-k="${k}" onclick="go('${k}')">${l}</button>`).join('')}</nav><main id="main"></main>`;go('dash')}
async function go(k,a){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===(k==='ac'?'dash':k)));$('#main').innerHTML='<p class="mu">Loading…</p>';await pages[k](a);scrollTo(0,0)}

pages.dash=async()=>{await load();const A=D.acc;
 if(!A.length)return $('#main').innerHTML=`<div class="card">${me.admin?'No accounts yet. Add one under Manage.':'No accounts have been shared with you yet. Please contact your administrator.'}</div>`;
 const dup=A.length-new Set(A.map(a=>a.investor_id+'|'+a.account_no)).size,g={};A.forEach(a=>(g[a.investor_id]??=[]).push(a));
 $('#main').innerHTML=`<h1>${me.admin?'Portfolio overview':'Your investments'}</h1><p class="mu">${A.length} account${A.length>1?'s':''}</p>`
 +(me.admin&&dup?`<div class="card neg">${dup} duplicate account entr${dup>1?'ies':'y'} found (same investor and account number). Remove the extras under Manage.</div>`:'')
 +kp(agg(A))+Object.entries(g).map(([i,l])=>{const s=agg(l);return`<h2>${esc(D.nm[i])}</h2><div class="card ov"><table><tr><th>Account</th><th class="n">Invested</th><th class="n">Withdrawn</th><th class="n">Profit / loss</th><th>Recovered</th></tr>${l.map(a=>{const x=st(a);return`<tr class="go" onclick="go('ac','${a.id}')"><td><b>${esc(a.account_no)}</b><br><span class="mu">${esc(a.broker)} ${esc(a.platform)}</span></td><td class="n">${fmt(x.inv)}</td><td class="n">${fmt(x.wd)}</td><td class="n">${sg(x.pr)}</td><td><div class="bar"><i style="width:${Math.min(x.ret,100)}%"></i></div><span class="mu">${x.ret.toFixed(1)}%</span></td></tr>`}).join('')}<tr><td><b>Total</b></td><td class="n"><b>${fmt(s.inv)}</b></td><td class="n"><b>${fmt(s.wd)}</b></td><td class="n">${sg(s.pr)}</td><td></td></tr></table></div>`}).join('')};

const entryForm=a=>`<h2>Add entry</h2><div class="card np"><div class="fg"><label>Type<select id="et"><option value="deposit">Deposit (invested)</option><option value="withdrawal">Withdrawal (paid back)</option><option value="profit_share">Profit share</option><option value="profit_payout">Profit payout</option><option value="daily">Daily profit / loss</option></select></label><label>Amount (minus for a loss)<input id="ea" type="number" step="any"></label><label>Date<input id="ed" type="date" value="${today()}"></label><label>Currency<input id="ec" value="USD"></label><label>Reference<input id="er"></label><label>Notes<input id="en"></label></div><label>Proof photos<input id="ef" type="file" accept="image/*" multiple></label><button class="btn" onclick="addE('${a.id}')">Save entry</button><button class="btn o" onclick="upBal('${a.id}')">Update balance</button><button class="btn o neg" onclick="delAcc('${a.id}')">Delete account</button></div>`;
pages.ac=async id=>{await load();const a=D.acc.find(x=>x.id===id);if(!a)return go('dash');const x=st(a),urls={},paths=x.t.flatMap(t=>t.proofs||[]),mon={};
 if(paths.length){const{data}=await sb.storage.from('proofs').createSignedUrls(paths,3600);(data||[]).forEach(d=>urls[d.path]=d.signedUrl)}
 x.p.forEach(r=>{const m=r.pdate.slice(0,7);mon[m]=(mon[m]||0)+Number(r.amount)});
 $('#main').innerHTML=`<button class="mu np" onclick="go('dash')">← Back to overview</button><h1>${esc(D.nm[a.investor_id])} · ${esc(a.account_no)}</h1><p class="mu">${esc(a.broker)} ${esc(a.platform)} ${esc(a.acc_type)} · started ${a.start_date||'n/a'}</p>${kp(x)}
 <h2>Daily profit / loss</h2><div class="card">${bars(x.p)}</div>
 <h2>Monthly result</h2><div class="card ov"><table>${Object.entries(mon).sort().reverse().map(([m,v])=>`<tr><td>${m}</td><td class="n">${sg(v)}</td></tr>`).join('')||'<tr><td class="mu">Nothing recorded yet.</td></tr>'}</table></div>
 ${me.admin?entryForm(a):''}
 <h2>Money in and out</h2><div class="card ov"><table>${x.t.map(t=>{const outc=(t.type==='withdrawal'||t.type==='profit_payout')?'pos':(t.amount<0?'neg':'');return `<tr><td>${t.tx_date}</td><td>${esc(t.type.replace('_',' '))}</td><td class="n ${outc}">${fmt(t.amount)} ${esc(t.currency)}</td><td class="mu">${esc(t.reference)} ${esc(t.notes)}</td><td>${(t.proofs||[]).map(p=>urls[p]?`<a href="${urls[p]}" target="_blank">proof</a>`:'').join(' ')}</td>${me.admin?`<td class="np">${t.amount>0?`<button class="mu" onclick="rev('${t.id}')">Reverse</button> `:''}<button class="neg" onclick="delTx('${t.id}')">Delete</button></td>`:''}</tr>`}).join('')||'<tr><td class="mu">No entries yet.</td></tr>'}</table></div>`};
function compress(file){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.7)};i.src=URL.createObjectURL(file)})}
async function addE(id){const f=k=>$('#'+k).value,v=Number(f('ea')),a=D.acc.find(x=>x.id===id);if(!f('ea'))return alert('Enter an amount');let e;
 if(f('et')==='daily')({error:e}=await sb.from('daily_profit').upsert({account_id:id,pdate:f('ed'),amount:v},{onConflict:'account_id,pdate'}));
 else{const ps=[];for(const file of $('#ef').files){const p=`${a.investor_id}/${crypto.randomUUID()}.jpg`,{error}=await sb.storage.from('proofs').upload(p,await compress(file),{contentType:'image/jpeg'});if(error)return alert(error.message);ps.push(p)}
  ({error:e}=await sb.from('transactions').insert({investor_id:a.investor_id,account_id:id,type:f('et'),amount:v,currency:f('ec')||'USD',tx_date:f('ed'),reference:f('er'),notes:f('en'),proofs:ps}))}
 e?alert(e.message):go('ac',id)}
async function rev(id){const t=D.tx.find(x=>x.id===id);if(!confirm('Create a reversing entry?'))return;const{error}=await sb.from('transactions').insert({investor_id:t.investor_id,account_id:t.account_id,type:t.type,amount:-t.amount,currency:t.currency,tx_date:today(),notes:'REVERSAL of '+id.slice(0,8)});error?alert(error.message):go('ac',t.account_id)}
async function delTx(id){const t=D.tx.find(x=>x.id===id);if(!confirm('Delete this entry for good? This cannot be undone.'))return;const{error}=await sb.from('transactions').delete().eq('id',id);error?alert(error.message):go('ac',t.account_id)}
async function upBal(id){const v=prompt('New account balance?');if(v===null||v===''||isNaN(v))return;const{error}=await sb.from('accounts').update({current_balance:Number(v)}).eq('id',id);error?alert(error.message):go('ac',id)}
async function delAcc(id){if(!confirm('Delete this account and its entries?'))return;const{error}=await sb.from('accounts').delete().eq('id',id);error?alert(error.message):go('mg')}

pages.mg=async()=>{await load();$('#main').innerHTML=`<h1>Manage</h1><h2>Add investor</h2><div class="card"><div class="fg"><label>Name<input id="n"></label><label>Phone<input id="p"></label><label>Email (record only)<input id="e"></label><label>Profit share %<input id="s" type="number" value="100"></label></div><button class="btn" onclick="addInv()">Save investor</button></div>
 <h2>Add trading account</h2><div class="card"><div class="fg"><label>Investor<select id="ai">${D.inv.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></label><label>Account number<input id="an"></label><label>Broker<input id="ab"></label><label>Platform<select id="ap"><option>MT4</option><option>MT5</option><option>Other</option></select></label><label>Account type<input id="at"></label><label>Starting balance<input id="asb" type="number"></label><label>Start date<input id="asd" type="date" value="${today()}"></label></div><button class="btn" onclick="addAcc()">Save account</button></div>
 <h2>All accounts</h2><div class="card ov"><table><tr><th>Investor</th><th>Account</th><th>ID</th><th></th></tr>${D.acc.map(a=>`<tr><td>${esc(D.nm[a.investor_id])}</td><td>${esc(a.account_no)}</td><td class="mu">${a.id.slice(0,6)}</td><td><button class="neg" onclick="delAcc('${a.id}')">Delete</button></td></tr>`).join('')}</table></div>`};
async function addInv(){const n=$('#n').value.trim();if(!n)return alert('Enter a name');const{error}=await sb.from('investors').insert({name:n,phone:$('#p').value,email:$('#e').value.trim(),share_pct:Number($('#s').value)});error?alert(error.message):go('mg')}
async function addAcc(){const b=Number($('#asb').value)||0,{error}=await sb.from('accounts').insert({investor_id:$('#ai').value,account_no:$('#an').value,broker:$('#ab').value,platform:$('#ap').value,acc_type:$('#at').value,start_balance:b,current_balance:b,start_date:$('#asd').value});error?alert(error.message):go('mg')}

pages.acx=async()=>{await load();const{data:lg,error}=await sb.rpc('admin_list_logins');if(error)alert(error.message);const ac=await q('account_access'),us=(lg||[]).filter(u=>u.role!=='admin');
 $('#main').innerHTML=`<h1>Access</h1><p class="mu">Tick an account to let that login see it. Admins always see everything.</p><div class="card"><b>Creating an investor's login</b><p class="mu">Go to your <a href="https://supabase.com/dashboard" target="_blank">Supabase dashboard</a> → Authentication → Add user, enter their email and a password, and share that password with them. Their email then appears below — tick the accounts they should see.</p></div>`+(us.map(u=>`<div class="card"><b>${esc(u.email)}</b><div style="margin-top:10px">${D.acc.map(a=>`<label style="display:flex;align-items:center;color:var(--ink);font-size:15px;padding:5px 0"><input type="checkbox" ${ac.some(r=>r.user_id===u.id&&r.account_id===a.id)?'checked':''} onchange="setAcc('${u.id}','${a.id}',this.checked)">${esc(D.nm[a.investor_id])} · ${esc(a.account_no)}&nbsp;<span class="mu">${esc(a.broker)} · ${a.id.slice(0,4)}</span></label>`).join('')}</div></div>`).join('')||'<div class="card">No investor logins yet. Add users in Supabase under Authentication.</div>')};
async function setAcc(u,a,on){const{error}=on?await sb.from('account_access').insert({user_id:u,account_id:a}):await sb.from('account_access').delete().eq('user_id',u).eq('account_id',a);if(error){alert(error.message);go('acx')}}

pages.rep=async()=>{await load();$('#main').innerHTML=`<h1>Statement</h1><div class="card np"><div class="fg"><label>Investor<select id="ri" onchange="runRep()">${D.inv.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></label><label>From<input id="rf" type="date"></label><label>To<input id="rt" type="date" value="${today()}"></label></div><button class="btn" onclick="runRep()">Show</button><button class="btn o" onclick="csv()">Download CSV</button><button class="btn o" onclick="print()">Print / PDF</button></div><div id="out"></div>`;runRep()};
function runRep(){const i=$('#ri').value,f=$('#rf').value,t=$('#rt').value,A=D.acc.filter(a=>a.investor_id===i),no=Object.fromEntries(A.map(a=>[a.id,a.account_no]));
 RP=D.tx.filter(x=>x.investor_id===i&&(!f||x.tx_date>=f)&&(!t||x.tx_date<=t)).reverse().map(x=>({...x,no:no[x.account_id]}));
 $('#out').innerHTML=`<div class="card ov"><b>${esc(D.nm[i])}</b><table><tr><th>Account</th><th class="n">Invested</th><th class="n">Paid out</th><th class="n">Profit / loss</th></tr>${A.map(a=>{const x=st(a);return`<tr><td>${esc(a.account_no)}</td><td class="n">${fmt(x.inv)}</td><td class="n">${fmt(x.paidOut)}</td><td class="n">${sg(x.pr)}</td></tr>`}).join('')}</table></div>
 <div class="card ov"><table><tr><th>Date</th><th>Account</th><th>Type</th><th class="n">Amount</th><th>Reference</th></tr>${RP.map(x=>`<tr><td>${x.tx_date}</td><td>${esc(x.no)}</td><td>${esc(x.type.replace('_',' '))}</td><td class="n">${fmt(x.amount)} ${esc(x.currency)}</td><td class="mu">${esc(x.reference)}</td></tr>`).join('')}</table></div>`}
function csv(){const s=[['Date','Account','Type','Amount','Currency','Reference','Notes'],...RP.map(t=>[t.tx_date,t.no,t.type,t.amount,t.currency,t.reference,t.notes])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='statement.csv';a.click()}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
start();
</script></body></html>
